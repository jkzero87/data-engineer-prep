use_default_settings: true

server:
  secret_key: "change-this-to-random-secret-key"
  limiter: false
  image_proxy: true

search:
  safe_search: 0
  formats:
    - html
    - json

engines:
  # independent indexes — own crawlers, no shared quota, rarely block
  - name: mojeek
    disabled: false
  - name: marginalia
    disabled: false
  - name: qwant
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
  # mainstream
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: brave
    disabled: false
  - name: startpage
    disabled: false
  # technical
  - name: github
    disabled: false
  - name: stackoverflow
    disabled: false
  - name: askubuntu
    disabled: false
  - name: arxiv
    disabled: false
